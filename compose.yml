services:
  multiolx:
    build: .
    restart: unless-stopped
    env_file: .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/chromium-seccomp.json
    shm_size: 1gb
    stop_grace_period: 45s
    volumes:
      - multiolx-data:/data
volumes:
  multiolx-data:
