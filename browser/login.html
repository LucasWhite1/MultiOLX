<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · MultiOLX</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="apple-touch-icon" href="/icons/app-192.png" />
    <link rel="stylesheet" href="web.css" />
    <script src="login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="login-brand">MultiOLX</div>
      <h1>Entre no seu espaço</h1>
      <p>Acesse suas contas, conversas e anúncios.</p>
      <form id="loginForm">
        <label for="username">Usuário</label
        ><input id="username" autocomplete="username" required maxlength="80" /><label
          for="password"
          >Senha</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="256"
        /><button id="loginSubmit">Entrar</button>
        <p id="loginError" role="alert"></p>
      </form>
    </main>
  </body>
</html>
